<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>WotW Live Map</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">WAY OF THE WICKED</div>
      <h1 id="scene-title">Live tactical map</h1>
    </div>
    <div class="controls">
      <span id="connection" class="connection">connecting</span>
      <button id="grid-toggle" type="button">Grid</button>
      <button id="coords-toggle" type="button">Coords</button>
      <button id="fullscreen-toggle" type="button">Fullscreen</button>
    </div>
  </header>

  <main>
    <section id="map-shell" class="map-shell" aria-live="polite">
      <div id="empty-state" class="empty-state">
        <strong>No active tactical map.</strong>
        <span>Cartographer will wake this page when a player-safe map is published.</span>
      </div>
      <div id="stage" class="stage" hidden>
        <img id="base-map" alt="Current tactical map">
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg" aria-label="Tactical token overlay"></svg>
      </div>
    </section>

    <aside class="status-panel">
      <div>
        <span class="label">Updated</span>
        <span id="updated-at">never</span>
      </div>
      <div>
        <span class="label">Revision</span>
        <code id="revision">-</code>
      </div>
      <div id="token-detail" class="token-detail">Click a token for details.</div>
    </aside>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
